    <style>
        .box{
            text-align: center;
        }
        .aa{
            width: 100px;
            height: 100px;
            background-color: black;
            margin: auto;
            margin-top: 20px;
        }
        input:hover{
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <form action="">
            <input type="button" value="变宽">
            <input type="button" value="变高">
            <input type="button" value="变色">
            <input type="button" value="隐藏">
            <input type="reset" value="重置">
        </form>
        <div class="aa"></div>
    </div>
<script>
    // 第一步：找标签
    var div = document.querySelector('.aa');
    var btns = document.querySelectorAll('input');

    var attrs = ['width', 'height', 'backgroundColor', 'display', 'cssText'];
    var values = ['200px', '200px', 'red', 'none', ''];

    for(var i = 0; i < btns.length; i++){
        btns[i].index = i;
        btns[i].onclick = function(){
            // console.log(this);
            // console.log(attrs[this.index]);
            // this.style.attrs[this.index] 相当于  this.style.'width'
            div.style[attrs[this.index]] = values[this.index]
        }
    }
