<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="author" content="金西振">
    <title></title>
    <style>
        /* .box{
            width: 600px;
            height: 100px;
        } */
        .item{
            width: 100px;
            height: 100px;
            border: 1px solid;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="item">01</div>
        <div class="item">02</div>
        <div class="item">03</div>
        <div class="item">04</div>
        <div class="item">05</div>
        <div class="item">06</div>
        <div class="item">07</div>
    </div>
<script>
    var divs = document.querySelectorAll('.item');
    var colors = ['red', 'orange', 'yellow', 'green', 'cyan', 'blue', 'purple']
    
    // 1、按照顺序点击div分别输出0 1 2 3 4 5 6
    // 2、点击div分别变成红 橙 黄 绿 青 蓝 紫
    for(var i = 0; i < divs.length; i++){
        var div = divs[i];
        div.index = i;//给每一个div添加一个index属性来记录i的值

        // 当点击div的时候，for语句已经执行完毕，i的值最终为7，在点击事件中打印i的值，始终都是7
        div.onclick = function(ev){
            // 这里的div永远都是最后一个div，执行for语句的时候，点击事件还没有出发，当for执行完最后一次，div取得是divs[6]的值，是最后一个div，当for语句执行完毕，i的值最终变为7
            // console.log(div);
            // console.log(ev.target);//触发事件的目标元素
            // console.log(this);//指向绑定事件函数的元素

            // console.log(this.index, ev.target.index);
            // this.style.backgroundColor = '#f0'+this.index;
            this.style.backgroundColor = colors[this.index];
        }
    }

    
</script>
</body>
</html>
