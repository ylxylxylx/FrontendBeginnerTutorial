    <style>
        *{
            box-sizing: border-box;
        }
        .outer{
            width: 260px;
            height: 310px;
            border-radius: 5px;
            /* margin: 200px auto; */
            /* background-color: rgba(0, 0, 0, 0.3); */
            padding: 5px;
            float: left;
        }
        .box {
            width: 250px;
            height: 300px;
            border: 1px solid red;
            overflow: hidden;
            position: relative;
            border-radius: 5px;
        }
        .img-box {
            width: 610px;
            display: flex;
            flex-wrap: wrap;
            transform: rotate(30deg);
            animation: move 10s linear infinite alternate;
            position: relative;
            left: -175px;
            top: -8%;
            z-index: -1;
        }
        .img-box div {
            width: 200px;
            height: 250px;
        }
        .img-box div>img {
            width: 200px;
            height: 250px;
        }

        @keyframes move {
            0% {
                top: -8%
            }

            100% {
                top: -130%
            }
        }
        .info{
            width: 100%;
            height: 60px;
            background-color: red;
            position: absolute;
            left: 0;
            bottom: 0;
            z-index: 1;
        }
        .overlay{
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.3);
            display: none;
        }
        .outer:hover .overlay{
            display: block;
        }
        .outer:hover{
            background-color: rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
