    <title>Document</title>
    <style>
        html,body{
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .box{
            width: 100px;
            height: 100px;
            background-color: red;
            position: absolute;
            top: 100px;
            left: 100px;

            animation: move  1s linear infinite  alternate forwards;
        }
        @keyframes move{
            0%{
                /* 开始状态 */
                left: 100px;
            }
            100%{
                /* 结束状态 */
                /* 关键帧动画的开始状态的属性和结束状态的属性要保持一致，否则，不能实现动画效果 */
                left:calc(100% - 100px - 100px); 
            }
        }
        /* 
        animation关键帧动画 和 transition过渡动画：都是随着时间的改变元素的属性实现动画效果
        区别：
            1、transition过渡动画需要一个触发条件：:hover :active；animation在不需要任何触发的条件的情况下，也可以显式的实现动画效果
            2、过渡动画只有一组：开始状态到结束状态；关键帧动画可以设置每一帧的动画状态，一般用于复杂的动画效果
         */

    </style>
</head>
